name: Publicar en Firebase

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Revisar sintaxis
        run: |
          for f in public/*.js; do node --check "$f" || exit 1; done

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Publicar app y reglas de seguridad
        run: npx --yes firebase-tools@latest deploy --only hosting,firestore:rules --project tickets-8e88b --non-interactive
