<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B0B0C">
<title>Tu ticket</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Marca Fashioncel: negro, blanco y un solo acento dorado, igual que fashioncel.com.mx. Siempre en negro. */
:root{color-scheme:dark;--bg:#0B0B0C;--ink:#FFFFFF;--muted:#A9A9AE;--paper:#FFFFFF;--line:#2A2A2E;--gold:#E6B422;--bad:#FF8A7E;--bad-soft:#3A1B19;
  --ui:"Montserrat",system-ui,-apple-system,"Segoe UI",sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);padding:max(22px,env(safe-area-inset-top)) 16px max(32px,env(safe-area-inset-bottom))}
main{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:18px;align-items:center}
.brand{height:22px;width:auto;filter:invert(1);margin-bottom:4px}
h1{font-weight:800;font-size:24px;line-height:1.1;margin:0;text-align:center;text-transform:uppercase;letter-spacing:-.01em}
h1 mark{background:var(--gold);color:#0B0B0C;padding:0 6px}
.sub{color:var(--muted);margin:-8px 0 0;text-align:center;font-size:14px}
.receipt{background:var(--paper);color:#1B1B1B;font-family:var(--mono);font-size:min(12.5px,calc((100vw - 64px)/(32*.62)));line-height:1.45;padding:16px 12px 20px;box-sizing:content-box;width:32ch;max-width:calc(100% - 24px)}
.receipt .l{white-space:pre;min-height:1.45em}.receipt .c{text-align:center}.receipt .b{font-weight:600}
.receipt .g{font-size:1.5em;line-height:1.3}
.receipt .logo img{display:block;margin:0 auto 6px;width:24ch;height:auto}
.cupon{font-family:var(--mono);background:var(--gold);color:#0B0B0C;padding:1px 6px;letter-spacing:.04em;font-weight:600}
.cancel{background:var(--bad-soft);color:var(--bad);font-weight:700;padding:10px 14px;text-align:center;width:100%}
.cta{display:block;width:100%;text-align:center;background:var(--gold);color:#0B0B0C;text-decoration:none;font-weight:800;padding:16px;font-size:14px;text-transform:uppercase;letter-spacing:.08em;border-radius:2px}
.promo{text-align:center;color:var(--muted);margin:-6px 0 0;font-size:13px;line-height:1.6}
.msg{color:var(--muted);text-align:center;padding:40px 0}
.fac{width:100%}
.card{background:#FFFFFF;color:#1B1B1B;padding:18px;display:flex;flex-direction:column;gap:12px;border-radius:2px}
.ft{font-size:18px;font-weight:800;text-transform:uppercase;letter-spacing:-.01em}
label.f{display:flex;flex-direction:column;gap:5px;font-size:12px;font-weight:700;color:#55565c}
.hint{font-weight:500;font-size:11.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
input,select{font:inherit;font-size:16px;color:#1B1B1B;background:#fff;border:1px solid #c9c9c4;border-radius:2px;padding:11px 12px;width:100%;min-width:0}
input:focus,select:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.err{color:#B42318;font-weight:600;font-size:14px;min-height:1em}
.sec{display:block;width:100%;font:inherit;font-weight:700;font-size:13px;text-transform:uppercase;letter-spacing:.08em;padding:14px;border-radius:2px;border:1px solid #FFFFFF;background:transparent;color:#FFFFFF;cursor:pointer}
.card .sec{color:#1B1B1B;border-color:#c9c9c4}
button.cta{border:0;cursor:pointer;font:inherit;font-weight:800;font-size:14px}
.card .cta{background:#0B0B0C;color:#fff}
.ok{background:#17171A;color:#fff;border-left:4px solid var(--gold);padding:14px 16px;font-weight:600;margin-bottom:10px;font-size:14px;line-height:1.5}
</style>
</head>
<body>
<main id="m"><p class="msg">Cargando tu ticket…</p></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { firebaseConfig } from "/firebase-config.js";
import { formHTML, leerForm, validar, formatoListo, enviarContador, FORMATO_DEFAULT } from "/fiscal.js";
const m = document.getElementById("m");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(n || 0);
const parts = location.pathname.split("/").filter(Boolean);
const tk = parts[0] === "t" ? parts[1] : new URLSearchParams(location.search).get("t");
const fail = msg => { m.innerHTML = `<p class="msg">${msg}</p>`; };
try {
  if (!tk || !/^[A-Za-z0-9]{16,40}$/.test(tk)) throw new Error("bad");
  const db = getFirestore(initializeApp(firebaseConfig));
  const s = await getDoc(doc(db, "publicos", tk));
  if (!s.exists()) fail("No encontramos este ticket. Revisa que el link esté completo.");
  else {
    const t = s.data();
    document.title = `Ticket #${String(t.folio).padStart(5, "0")} · ${t.negocio}`;
    const lines = (t.lineas || []).map(l => l.logo
      ? `<div class="l c logo"><img src="/logo.png" alt="${esc(l.text)}"></div>`
      : `<div class="l${l.center ? " c" : ""}${l.bold ? " b" : ""}${l.big ? " g" : ""}">${esc(l.text) || " "}</div>`).join("");
    m.innerHTML = `
      <img class="brand" src="/logo.png" alt="${esc(t.negocio || "Fashioncel")}">
      <h1><mark>Gracias</mark> por tu compra</h1>
      <p class="sub">Ticket #${String(t.folio).padStart(5, "0")} · ${money(t.total)}</p>
      ${t.estado === "cancelado" ? `<div class="cancel">Este ticket fue cancelado</div>` : ""}
      <div class="receipt">${lines}</div>
      ${t.estado === "cancelado" ? "" : `<section class="fac" id="fac"></section>`}
      <a class="cta" href="https://fashioncel.com.mx" target="_blank" rel="noopener">Comprar en fashioncel.com.mx</a>
      <p class="promo">Recibe 10% de descuento en tu primera compra en línea${t.cupon ? ` con el cupón <b class="cupon">${esc(t.cupon)}</b>. Válido solo en fashioncel.com.mx, no aplica en tienda física` : ""}.</p>`;
    if (t.estado !== "cancelado") factura(db, t);
  }
} catch (e) { fail("No pudimos abrir el ticket. Revisa tu conexión e intenta de nuevo."); }

// ---- Solicitud de factura por el cliente ----
async function factura(db, t) {
  const box = document.getElementById("fac");
  const ref = doc(db, "facturas", tk);
  let f = null;
  try { const s = await getDoc(ref); if (s.exists()) f = s.data(); } catch (e) {}
  // Formato del contador: si está conectado, la solicitud se manda a su formulario en cuanto se pide.
  let formato = FORMATO_DEFAULT;
  try { const s = await getDoc(doc(db, "publico", "formato")); if (s.exists()) formato = s.data(); } catch (e) {}
  const estado = () => {
    if (f && f.estado === "facturada") { box.innerHTML = `<div class="ok">Tu factura ya fue emitida y se envió a <b>${esc(f.email)}</b>.</div>`; return; }
    if (f) { box.innerHTML = `<div class="ok">Recibimos tu solicitud de factura para <b>${esc(f.razonSocial)}</b> (${esc(f.rfc)}). Te llegará a <b>${esc(f.email)}</b>.</div>${f.contador ? `<p class="promo" style="margin:0">Tu solicitud ya está con facturación. Si necesitas corregir un dato, comunícate con la tienda.</p>` : `<button class="sec" id="fEdit">Corregir mis datos</button>`}`; const ed = document.getElementById("fEdit"); if (ed) ed.onclick = form; return; }
    box.innerHTML = `<button class="sec" id="fOpen">¿Necesitas factura? Solicítala aquí</button>`; document.getElementById("fOpen").onclick = form;
  };
  const form = () => {
    box.innerHTML = `<form id="fForm" class="card" autocomplete="off"><strong class="ft">Solicitar factura</strong>${formHTML(f || {}, t.metodo || "")}<div class="err" id="fErr"></div><button class="cta" type="submit">Enviar solicitud</button><button class="sec" type="button" id="fCancel">Cancelar</button></form>`;
    document.getElementById("fCancel").onclick = estado;
    document.getElementById("fForm").addEventListener("input", () => { document.getElementById("fErr").textContent = ""; });
    document.getElementById("fForm").onsubmit = async e => {
      e.preventDefault();
      const d = leerForm(box), msg = validar(d), err = document.getElementById("fErr");
      if (msg) { err.textContent = msg; return; }
      const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Enviando…";
      const data = { ...d, folio: t.folio, total: t.total, metodo: t.metodo || "", fechaVenta: t.fechaLocal, dia: t.dia || "", estado: "pendiente", origen: "cliente", creadoEn: serverTimestamp() };
      try {
        await setDoc(ref, data); f = data;
        if (formatoListo(formato) && formato.auto !== false && !(await enviarContador(formato, data))) {
          const contador = new Date().toISOString();
          try { await updateDoc(ref, { contador }); f = { ...data, contador }; } catch (e3) {}
        }
        estado();
      }
      catch (e2) { err.textContent = "No se pudo enviar. Revisa tu conexión e intenta de nuevo."; btn.disabled = false; btn.textContent = "Enviar solicitud"; }
    };
  };
  estado();
}
</script>
</body>
</html>
