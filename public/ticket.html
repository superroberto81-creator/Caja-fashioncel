<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0E0E10">
<title>Tu ticket</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;600;700&family=Barlow+Condensed:wght@600&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
:root{--bg:#F3F3F1;--ink:#0E0E10;--muted:#63646B;--paper:#FFFFFF;--line:#E0E0DC;--bad:#B42318;--bad-soft:#FBE3E0;--btn:#0E0E10;--btn-ink:#fff;
  --ui:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;--display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace}
@media (prefers-color-scheme:dark){:root{color-scheme:dark;--bg:#0B0B0C;--ink:#F2F2F0;--muted:#A2A3AA;--paper:#F4F3EF;--line:#2A2A2E;--bad:#FF8A7E;--bad-soft:#3A1B19;--btn:#F2F2F0;--btn-ink:#0B0B0C}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);padding:max(20px,env(safe-area-inset-top)) 16px max(28px,env(safe-area-inset-bottom))}
main{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:16px;align-items:center}
h1{font-family:var(--display);font-weight:600;font-size:26px;margin:0;text-align:center;letter-spacing:.01em}
.sub{color:var(--muted);margin:-8px 0 0;text-align:center}
.receipt{background:var(--paper);color:#1B1B1B;font-family:var(--mono);font-size:min(12.5px,calc((100vw - 64px)/(32*.62)));line-height:1.45;padding:16px 12px 20px;box-sizing:content-box;width:32ch;max-width:calc(100% - 24px);box-shadow:0 10px 30px -14px rgba(0,0,0,.4)}
.receipt .l{white-space:pre;min-height:1.45em}.receipt .c{text-align:center}.receipt .b{font-weight:600}
.receipt .g{font-size:1.5em;line-height:1.3}
.cupon{font-family:var(--mono);color:var(--ink);letter-spacing:.04em}
.receipt .logo img{display:block;margin:0 auto 6px;width:24ch;height:auto}
.cancel{background:var(--bad-soft);color:var(--bad);font-weight:700;padding:10px 14px;border-radius:12px;text-align:center;width:100%}
.cta{display:block;width:100%;text-align:center;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:700;padding:15px;border-radius:14px;font-size:17px}
.promo{text-align:center;color:var(--muted);margin:-6px 0 0;font-size:14px}
.msg{color:var(--muted);text-align:center;padding:40px 0}
.fac{width:100%}
.card{background:var(--paper);color:#1B1B1B;border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.ft{font-family:var(--display);font-size:22px;font-weight:600}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:#55565c}
.hint{font-weight:500;font-size:12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
input,select{font:inherit;font-size:16px;color:#1B1B1B;background:#fff;border:1px solid #d6d6d1;border-radius:10px;padding:11px 12px;width:100%;min-width:0}
.err{color:#B42318;font-weight:600;font-size:14px;min-height:1em}
.sec{display:block;width:100%;font:inherit;font-weight:700;font-size:16px;padding:13px;border-radius:14px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.card .sec{color:#1B1B1B;border-color:#d6d6d1}
button.cta{border:0;cursor:pointer;font:inherit;font-weight:700;font-size:17px}
.card .cta{background:#0E0E10;color:#fff}
.ok{background:#DDF1E6;color:#12784A;border-radius:12px;padding:12px 14px;font-weight:600;margin-bottom:10px;text-align:center}
</style>
</head>
<body>
<main id="m"><p class="msg">Cargando tu ticket…</p></main>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";
import { firebaseConfig } from "/firebase-config.js";
import { formHTML, leerForm, validar } from "/fiscal.js";
const m = document.getElementById("m");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const money = n => new Intl.NumberFormat("es-MX", { style: "currency", currency: "MXN" }).format(n || 0);
const parts = location.pathname.split("/").filter(Boolean);
const tk = parts[0] === "t" ? parts[1] : new URLSearchParams(location.search).get("t");
const fail = msg => { m.innerHTML = `<p class="msg">${msg}</p>`; };
try {
  if (!tk || !/^[A-Za-z0-9]{16,40}$/.test(tk)) throw new Error("bad");
  const db = getFirestore(initializeApp(firebaseConfig));
  const s = await getDoc(doc(db, "publicos", tk));
  if (!s.exists()) fail("No encontramos este ticket. Revisa que el link esté completo.");
  else {
    const t = s.data();
    document.title = `Ticket #${String(t.folio).padStart(5, "0")} · ${t.negocio}`;
    const lines = (t.lineas || []).map(l => l.logo
      ? `<div class="l c logo"><img src="/logo.png" alt="${esc(l.text)}"></div>`
      : `<div class="l${l.center ? " c" : ""}${l.bold ? " b" : ""}${l.big ? " g" : ""}">${esc(l.text) || " "}</div>`).join("");
    m.innerHTML = `
      <h1>Gracias por tu compra</h1>
      <p class="sub">Ticket #${String(t.folio).padStart(5, "0")} · ${money(t.total)}</p>
      ${t.estado === "cancelado" ? `<div class="cancel">Este ticket fue cancelado</div>` : ""}
      <div class="receipt">${lines}</div>
      ${t.estado === "cancelado" ? "" : `<section class="fac" id="fac"></section>`}
      <a class="cta" href="https://fashioncel.com.mx" target="_blank" rel="noopener">Comprar en fashioncel.com.mx</a>
      <p class="promo">Recibe 10% de descuento en tu primera compra en línea${t.cupon ? ` con el cupón <b class="cupon">${esc(t.cupon)}</b>. Válido solo en fashioncel.com.mx, no aplica en tienda física` : ""}.</p>`;
    if (t.estado !== "cancelado") factura(db, t);
  }
} catch (e) { fail("No pudimos abrir el ticket. Revisa tu conexión e intenta de nuevo."); }

// ---- Solicitud de factura por el cliente ----
async function factura(db, t) {
  const box = document.getElementById("fac");
  const ref = doc(db, "facturas", tk);
  let f = null;
  try { const s = await getDoc(ref); if (s.exists()) f = s.data(); } catch (e) {}
  const estado = () => {
    if (f && f.estado === "facturada") { box.innerHTML = `<div class="ok">Tu factura ya fue emitida y se envió a <b>${esc(f.email)}</b>.</div>`; return; }
    if (f) { box.innerHTML = `<div class="ok">Recibimos tu solicitud de factura para <b>${esc(f.razonSocial)}</b> (${esc(f.rfc)}). Te llegará a <b>${esc(f.email)}</b>.</div><button class="sec" id="fEdit">Corregir mis datos</button>`; document.getElementById("fEdit").onclick = form; return; }
    box.innerHTML = `<button class="sec" id="fOpen">¿Necesitas factura? Solicítala aquí</button>`; document.getElementById("fOpen").onclick = form;
  };
  const form = () => {
    box.innerHTML = `<form id="fForm" class="card" autocomplete="off"><strong class="ft">Solicitar factura</strong>${formHTML(f || {})}<div class="err" id="fErr"></div><button class="cta" type="submit">Enviar solicitud</button><button class="sec" type="button" id="fCancel">Cancelar</button></form>`;
    document.getElementById("fCancel").onclick = estado;
    document.getElementById("fForm").addEventListener("input", () => { document.getElementById("fErr").textContent = ""; });
    document.getElementById("fForm").onsubmit = async e => {
      e.preventDefault();
      const d = leerForm(box), msg = validar(d), err = document.getElementById("fErr");
      if (msg) { err.textContent = msg; return; }
      const btn = e.target.querySelector("button[type=submit]"); btn.disabled = true; btn.textContent = "Enviando…";
      const data = { ...d, folio: t.folio, total: t.total, metodo: t.metodo || "", fechaVenta: t.fechaLocal, dia: t.dia || "", estado: "pendiente", origen: "cliente", creadoEn: serverTimestamp() };
      try { await setDoc(ref, data); f = data; estado(); }
      catch (e2) { err.textContent = "No se pudo enviar. Revisa tu conexión e intenta de nuevo."; btn.disabled = false; btn.textContent = "Enviar solicitud"; }
    };
  };
  estado();
}
</script>
</body>
</html>
